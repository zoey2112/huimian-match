<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>河南烩面烹饪动词匹配</title>
<style>
:root{--r:#963629;--bg:#fbf6ef;--ink:#342820;--muted:#806f62;--line:#eadbca}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}header{background:var(--r);color:white;padding:24px max(20px,calc((100vw - 1050px)/2))}header small{letter-spacing:2px;opacity:.85}h1{margin:9px 0;font-size:clamp(24px,4vw,34px)}header p{margin:0;line-height:1.7}main{max-width:1050px;margin:24px auto;padding:0 16px 36px}.intro,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:18px}.intro{line-height:1.8;margin-bottom:18px}.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:12px 2px 7px}.track{height:8px;background:#eadccc;border-radius:9px;overflow:hidden}.fill{height:100%;width:0;background:var(--r);transition:.2s}.columns{display:grid;grid-template-columns:minmax(180px,.7fr) minmax(0,1.7fr);gap:16px;margin-top:18px}.panel h2{font-size:19px;margin:0 0 5px}.hint{font-size:13px;color:var(--muted);margin:0 0 14px}.words{display:grid;gap:10px}.word,.action,.control{cursor:pointer;font:inherit}.word{border:1px solid var(--line);background:#fffaf5;border-radius:11px;padding:13px;text-align:left;font-size:19px;font-weight:bold;display:flex;justify-content:space-between}.word.selected,.action.selected{border:2px solid var(--r);background:#fff3ed;padding:12px}.word.matched,.action.matched{background:#edf6ef;border-color:#9bbba7;color:#286447}.tag{font-size:11px;font-weight:normal;color:var(--muted)}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.action{border:1px solid var(--line);background:white;border-radius:12px;padding:11px;text-align:left;min-height:145px;color:var(--ink)}.art{height:66px;border-radius:8px;background:#f8eee2;display:flex;align-items:center;justify-content:center;margin-bottom:8px}.art svg{width:100%;height:64px}.action strong{display:block;font-size:14px;margin-bottom:4px}.action span{display:block;font-size:12px;color:var(--muted);line-height:1.5}.controls{display:flex;gap:10px;margin-top:17px}.control{padding:11px 18px;border:1px solid var(--line);border-radius:10px;background:white}.primary{background:var(--r);color:white;border-color:var(--r)}button:disabled{cursor:default;opacity:.8}.feedback{padding:13px 15px;border-radius:11px;background:#f6eee4;margin-top:14px;line-height:1.7;min-height:48px}.good{background:#edf6ef;color:#286447}.bad{background:#fff0eb;color:#963629}.note{font-size:13px;color:var(--muted);line-height:1.7}@media(max-width:680px){.columns{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.action{min-height:120px}}
</style></head><body>
<header><small>巧味中原 · 数字化学习任务</small><h1>烹饪动词：看动作，选词语</h1><p>认识河南烩面制作及相关烹饪活动中的五个动词：揉、扯、烩、熬、炖。</p></header>
<main><section class="intro"><b>学习任务</b><br>先点击左侧一个词语，再点击右侧与它对应的动作图卡。完成五组匹配后，点击“检查答案”。请根据动作特点判断。</section>
<div class="progress"><span id="progressText">已完成 0 / 5 组</span><span id="selectedText">先选择一个词语</span></div><div class="track"><div class="fill" id="fill"></div></div>
<section class="columns"><div class="panel"><h2>① 选择烹饪动词</h2><p class="hint">点击一个词语，再选择右侧动作</p><div class="words">
<button class="word" data-word="rou">揉 <span class="tag">动作词</span></button><button class="word" data-word="che">扯 <span class="tag">动作词</span></button><button class="word" data-word="hui">烩 <span class="tag">烹饪词</span></button><button class="word" data-word="ao">熬 <span class="tag">烹饪词</span></button><button class="word" data-word="dun">炖 <span class="tag">烹饪词</span></button></div></div>
<div class="panel"><h2>② 选择对应的动作</h2><p class="hint">观察动作示意和文字说明，判断对应哪个词语</p><div class="actions" id="actions">
<button class="action" data-action="ao"><div class="art"><svg viewBox="0 0 200 70"><path d="M55 38h90l-8 23H63z" fill="#b86b42" stroke="#70452f" stroke-width="3"/><path d="M49 37h102" stroke="#70452f" stroke-width="4"/><path d="M82 27c-8-9 8-12 0-22M105 27c-8-9 8-12 0-22M128 27c-8-9 8-12 0-22" fill="none" stroke="#d89a55" stroke-width="3"/></svg></div><strong>A. 持续加热汤汁</strong><span>锅里的汤长时间加热，慢慢形成味道。</span></button>
<button class="action" data-action="che"><div class="art"><svg viewBox="0 0 200 70"><path d="M57 46q43-10 86 0" fill="none" stroke="#d8a45f" stroke-width="13" stroke-linecap="round"/><path d="M70 44L43 15M130 44l27-29" stroke="#b77b48" stroke-width="8" stroke-linecap="round"/><path d="M43 15l-8-7M157 15l8-7" stroke="#70452f" stroke-width="4"/></svg></div><strong>B. 双手拉长面剂</strong><span>把面剂向两边拉伸，逐渐变成长条面条。</span></button>
<button class="action" data-action="dun"><div class="art"><svg viewBox="0 0 200 70"><path d="M65 28h70l-7 34H72z" fill="#a85d3b" stroke="#70452f" stroke-width="3"/><path d="M59 27h82" stroke="#70452f" stroke-width="5"/><path d="M82 18q18-11 36 0M83 42q17 9 34 0" fill="none" stroke="#f1d29b" stroke-width="3"/></svg></div><strong>C. 小火长时间煮食材</strong><span>让肉类等食材在汤汁中慢慢熟透、入味。</span></button>
<button class="action" data-action="rou"><div class="art"><svg viewBox="0 0 200 70"><path d="M52 52q48-27 96 0l-8 10H60z" fill="#e8c58f" stroke="#b98a56" stroke-width="3"/><path d="M69 35l12-13 16 8 10-12 13 12 14-7 9 13" fill="none" stroke="#b98a56" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div><strong>D. 反复按压、折叠面团</strong><span>用手掌按压并反复折叠面团，使面团逐渐均匀。</span></button>
<button class="action" data-action="hui"><div class="art"><svg viewBox="0 0 200 70"><path d="M56 37h88l-9 25H65z" fill="#b86b42" stroke="#70452f" stroke-width="3"/><path d="M50 36h100" stroke="#70452f" stroke-width="4"/><path d="M95 9l-2 23M107 8v24" stroke="#e2c28c" stroke-width="7" stroke-linecap="round"/><circle cx="75" cy="45" r="4" fill="#6d8c4f"/><circle cx="130" cy="49" r="4" fill="#6d8c4f"/></svg></div><strong>E. 将面条与汤、配料一起烹制</strong><span>把面条和汤及其他配料放在一起进行烹制。</span></button>
</div></div></section>
<div class="controls"><button class="control primary" id="check">检查答案</button><button class="control" id="reset">重新匹配</button></div>
<div class="feedback" id="feedback">提示：先选左边的词语，再选右边的动作卡片。匹配后继续完成下一组。</div>
<p class="note">教学提示：“熬”和“炖”作为相关烹饪词汇拓展，不表示每一碗河南烩面都必须经过这两个步骤。课堂上可结合实际制作视频解释其使用场景。</p></main>
<script>
const correct={rou:"rou",che:"che",hui:"hui",ao:"ao",dun:"dun"};let selected=null,pairs={},checked=false;
const words=[...document.querySelectorAll(".word")],actions=[...document.querySelectorAll(".action")],feedback=document.getElementById("feedback");
function render(){words.forEach(b=>{let k=b.dataset.word;b.classList.toggle("selected",selected===k);b.classList.toggle("matched",!!pairs[k]);b.disabled=!!pairs[k]||checked});actions.forEach(b=>{let k=b.dataset.action;b.classList.toggle("selected",!!selected&&pairs[selected]===k);b.classList.toggle("matched",Object.values(pairs).includes(k));b.disabled=Object.values(pairs).includes(k)||checked});let n=Object.keys(pairs).length;document.getElementById("progressText").textContent=`已完成 ${n} / 5 组`;document.getElementById("fill").style.width=n*20+"%";document.getElementById("selectedText").textContent=selected?"当前已选："+({rou:"揉",che:"扯",hui:"烩",ao:"熬",dun:"炖"}[selected]):"先选择一个词语"}
words.forEach(b=>b.onclick=()=>{if(checked||pairs[b.dataset.word])return;selected=b.dataset.word;feedback.className="feedback";feedback.textContent="已选择词语，请点击右侧对应的动作卡片。";render()});
actions.forEach(b=>b.onclick=()=>{if(checked||!selected)return;let a=b.dataset.action;if(Object.values(pairs).includes(a))return;pairs[selected]=a;selected=null;feedback.className="feedback";feedback.textContent="已记录这一组匹配。继续完成其他词语。";render()});
document.getElementById("check").onclick=()=>{if(Object.keys(pairs).length!==5){feedback.className="feedback bad";feedback.textContent=`还有 ${5-Object.keys(pairs).length} 组未完成。`;return}checked=true;let score=Object.keys(correct).filter(k=>pairs[k]===correct[k]).length;feedback.className="feedback "+(score===5?"good":"bad");feedback.textContent=score===5?"全部正确！你已经掌握了五个烹饪动词。试着用“先……再……最后……”介绍制作过程。":"本次答对 "+score+"/5 组。正确对应：揉—按压、折叠面团；扯—拉长面剂；烩—面条与汤及配料一起烹制；熬—持续加热汤汁；炖—小火长时间煮食材。点击“重新匹配”再试一次。";render()};
document.getElementById("reset").onclick=()=>{selected=null;pairs={};checked=false;feedback.className="feedback";feedback.textContent="已重置。先选左边的词语，再选右边的动作卡片。";render()};render();
</script></body></html>
